<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Roboto', sans-serif; padding: 18px 22px; color: #1e293b; background: #f8fafc; font-size: 13px; margin: 0; }
    h3 { margin: 0 0 16px 0; color: #1e3a8a; font-size: 16px; font-weight: 700; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; }
    .form-row { display: flex; gap: 12px; margin-bottom: 12px; }
    .form-group { flex: 1; }
    label { display: block; font-weight: 600; margin-bottom: 5px; color: #334155; }
    input[type="text"], input[type="email"], select {
      width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 13px; background: #fff;
    }
    input:focus, select:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 2px rgba(37,99,235,0.15); }
    .btn-submit {
      background: #2563eb; color: #fff; border: none; padding: 11px 20px; border-radius: 6px; cursor: pointer; font-weight: 700; width: 100%; font-size: 14px; margin-top: 14px;
      box-shadow: 0 2px 4px rgba(37,99,235,0.25);
    }
    .btn-submit:hover { background: #1d4ed8; }
    .btn-submit:disabled { background: #94a3b8; cursor: not-allowed; }
    .error-box { background: #fef2f2; border: 1px solid #fca5a5; color: #b91c1c; padding: 8px 12px; border-radius: 6px; margin-bottom: 12px; display: none; }
  </style>
</head>
<body>
  <h3>👥 THÊM THÀNH VIÊN MỚI VÀO DỰ ÁN</h3>
  <div id="errorBox" class="error-box"></div>

  <form id="memberForm" onsubmit="event.preventDefault(); submitMember();">
    <div class="form-row">
      <div class="form-group">
        <label>Họ và tên (*):</label>
        <input type="text" id="fullName" placeholder="Ví dụ: Nguyễn Văn A" required>
      </div>
      <div class="form-group">
        <label>MSSV / Chi đoàn (*):</label>
        <input type="text" id="studentId" placeholder="Ví dụ: 725105... - K72" required>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Ban chuyên trách (*):</label>
        <select id="department" required>
          <option value="Ban Điều hành">Ban Điều hành</option>
          <option value="Ban Chuyên môn" selected>Ban Chuyên môn</option>
          <option value="Ban Truyền thông">Ban Truyền thông</option>
          <option value="Ban Hậu cần">Ban Hậu cần</option>
          <option value="Ban Cố vấn">Ban Cố vấn</option>
        </select>
      </div>
      <div class="form-group">
        <label>Vai trò dự án (*):</label>
        <input type="text" id="projectRole" placeholder="Ví dụ: Thành viên đội thi, Hậu cần..." required>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Email liên hệ (*):</label>
        <input type="email" id="email" placeholder="example@gmail.com" required>
      </div>
      <div class="form-group">
        <label>Số điện thoại:</label>
        <input type="text" id="phone" placeholder="0987654321">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Chuyên môn:</label>
        <input type="text" id="expertise" placeholder="Ví dụ: Tranh biện, Thiết kế, Hậu cần...">
      </div>
      <div class="form-group">
        <label>Khóa học / Lớp:</label>
        <input type="text" id="academicYear" placeholder="Ví dụ: K72 CNTT">
      </div>
    </div>

    <div class="form-group">
      <label>Ghi chú / Trách nhiệm chính:</label>
      <input type="text" id="notes" placeholder="Mô tả phân công ban đầu...">
    </div>

    <button type="submit" id="submitBtn" class="btn-submit">💾 Lưu Thành Viên & Cập Nhật Bảng</button>
  </form>

  <script>
    function showError(msg) {
      const box = document.getElementById('errorBox');
      if (!msg) { box.style.display = 'none'; return; }
      box.textContent = msg;
      box.style.display = 'block';
    }

    function submitMember() {
      showError("");
      const fullName = document.getElementById('fullName').value.trim();
      const studentId = document.getElementById('studentId').value.trim();
      const department = document.getElementById('department').value;
      const projectRole = document.getElementById('projectRole').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const expertise = document.getElementById('expertise').value.trim();
      const academicYear = document.getElementById('academicYear').value.trim();
      const notes = document.getElementById('notes').value.trim();

      if (!fullName || !studentId || !email) {
        showError("Vui lòng điền đủ Họ tên, MSSV và Email.");
        return;
      }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = "⏳ Đang ghi dữ liệu và đồng bộ bảng...";

      const memberData = {
        fullName, studentId, department, projectRole, email, phone, expertise, academicYear, notes
      };

      google.script.run
        .withSuccessHandler(function(res) {
          alert("✅ " + res);
          google.script.host.close();
        })
        .withFailureHandler(function(err) {
          showError("Lỗi: " + err.message);
          btn.disabled = false;
          btn.textContent = "💾 Lưu Thành Viên & Cập Nhật Bảng";
        })
        .addNewMemberFromDialog(memberData);
    }
  </script>
</body>
</html>
